services:
  - type: web
    name: weather-forecast-app
    env: node
    plan: free
    region: oregon
    buildCommand: npm run install:all && npm run build:client
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENWEATHER_API_KEY
        value: bf1b7ce57c0aa84b2acaaaf827be4952
      - key: CACHE_TTL_SECONDS
        value: 600
